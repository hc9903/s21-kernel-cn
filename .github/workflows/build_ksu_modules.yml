name: "S21 KSU 保留模块内核 (Route b 重编模块 + TWRP)"

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: '版本串 (匹配原厂 HZE1, 使重编模块 vermagic 与预编译模块一致)'
        required: false
        default: '-qgki-2370012-abG9910ZCUGHZE1'
      ksu_tag:
        description: 'KernelSU 版本 tag (5.4 内核只能用 v1.0.5)'
        required: false
        default: 'v1.0.5'
      upload_release:
        description: '构建成功后上传 GitHub Release (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: ksu-modules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 检出仓库 (脚本)
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libelf-dev libssl-dev \
            python3 rsync unzip xz-utils zip cpio
          sudo apt-get install -y libncurses5 libtinfo5 2>/dev/null || true
          [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] || \
            sudo ln -sf libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          [ -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] || \
            sudo ln -sf libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: 下载工具链 (clang r383902b1 + GCC 4.9)
        run: |
          mkdir -p toolchains/clang toolchains/gcc64
          curl --fail --location --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            | tar --extract --gzip --no-same-owner --directory toolchains/clang
          git clone --quiet --depth 1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64
          toolchains/clang/bin/clang --version
          toolchains/clang/bin/ld.lld --version

      - name: 下载并校验三星 CHN 源码 (G9910ZCUBHYDA)
        run: |
          for attempt in 1 2 3; do
            if curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
              --output samsung-osrc.zip \
              "https://github.com/hc9903/s21-kernel-cn/releases/download/1.0/SM-G9910_CHN_15_Opensource.zip" 2>/tmp/curl_err.log; then
              break
            fi
            echo "第 $attempt 次下载失败: $(tail -2 /tmp/curl_err.log)"
            sleep 20
          done
          echo "26f6282ae302eb7fafc18c6e1115fcfeed315753b8e915af1d04ceb0f166d994  samsung-osrc.zip" | sha256sum --check --strict
          mkdir source-archive kernel
          python3 -m zipfile -e samsung-osrc.zip source-archive
          tar --extract --gzip --no-same-owner \
            --file source-archive/Kernel.tar.gz --directory kernel
          chmod -R u+rwX kernel
          grep -m1 "CONFIG_CC_VERSION_TEXT" kernel/arch/arm64/configs/vendor/o1q_chn_openx_defconfig

      - name: 集成 KernelSU ${{ inputs.ksu_tag }} + 三星五补丁
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/tiann/KernelSU/${{ inputs.ksu_tag }}/kernel/setup.sh" -o /tmp/ksu_setup.sh
          sh /tmp/ksu_setup.sh "${{ inputs.ksu_tag }}"
          grep -q "KSU_COMPAT_HAS_CURRENT_SID" KernelSU/kernel/Makefile || \
            echo "ccflags-y += -DKSU_COMPAT_HAS_CURRENT_SID" >> KernelSU/kernel/Makefile
          python3 "$GITHUB_WORKSPACE/scripts/patch_ksu_samsung.py"

      - name: 配置 defconfig (保留 =m + 关安全 + KSU + 版本串匹配 HZE1)
        run: |
          cd kernel
          python3 "$GITHUB_WORKSPACE/scripts/kokubanify.py" \
            arch/arm64/configs/vendor/o1q_chn_openx_defconfig \
            none \
            "${{ inputs.localversion }}" \
            "true" \
            "true"
          echo "=== 转换后统计 (保留模块路线) ==="
          echo "=m 数量(应保留 ~66): $(grep -c '=m' arch/arm64/configs/vendor/o1q_chn_openx_defconfig || true)"
          echo "=y 数量: $(grep -c '=y' arch/arm64/configs/vendor/o1q_chn_openx_defconfig || true)"
          grep -E "CONFIG_KSU=|CONFIG_LOCALVERSION=" arch/arm64/configs/vendor/o1q_chn_openx_defconfig | tail -5

      - name: 编译内核 + 重编全部模块
        run: |
          cd kernel
          export ARCH=arm64
          CLANG_BIN=$(dirname "$(find "$GITHUB_WORKSPACE/toolchains" -maxdepth 4 -type f -path '*/bin/clang' | head -n1)")
          echo "CLANG_BIN=$CLANG_BIN"
          test -x "$CLANG_BIN/clang" || { echo "clang 未找到!"; exit 1; }
          CROSS="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          MP="-j$(nproc) O=out DTC_EXT=$PWD/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"
          COMMON="CROSS_COMPILE=$CROSS REAL_CC=$CLANG_BIN/clang CLANG_TRIPLE=aarch64-linux-gnu- CONFIG_SECTION_MISMATCH_WARN_ONLY=y DISABLE_WRAPPER=1"
          make $MP $COMMON vendor/o1q_chn_openx_defconfig
          make $MP $COMMON > "$GITHUB_WORKSPACE/build.log" 2>&1 || { echo "=== 构建失败: ==="; tail -150 "$GITHUB_WORKSPACE/build.log"; exit 1; }
          ls -la out/arch/arm64/boot/Image
          make $MP $COMMON modules > "$GITHUB_WORKSPACE/modules.log" 2>&1 || { echo "=== 模块构建失败: ==="; tail -150 "$GITHUB_WORKSPACE/modules.log"; exit 1; }
          make $MP $COMMON INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules_install" INSTALL_MOD_STRIP=1 modules_install >/dev/null 2>&1
          echo "=== 模块总数 ==="
          find "$GITHUB_WORKSPACE/modules_install" -name '*.ko' | wc -l
          echo "=== 关键模块存在性 ==="
          find "$GITHUB_WORKSPACE/modules_install" -name '*.ko' | grep -E 'camera|dhd|wlan|bcm|cs35|audio|nfc' | head -20

      - name: 严格验证 (版本串 + KSU + 模块数 + camera.ko)
        run: |
          cd kernel
          KREL=$(make O=out ARCH=arm64 -s kernelrelease)
          echo "kernelrelease=$KREL"
          echo "$KREL" | grep -F -- "${{ inputs.localversion }}" || { echo "版本串缺失!"; exit 1; }
          scripts/extract-ikconfig out/arch/arm64/boot/Image > /tmp/ikconfig.txt 2>/dev/null || { echo "extract-ikconfig 失败"; exit 1; }
          grep -q "CONFIG_KSU=y" /tmp/ikconfig.txt || { echo "CONFIG_KSU=y 缺失!"; exit 1; }
          grep -E "CONFIG_KSU=|CONFIG_LOCALVERSION=" /tmp/ikconfig.txt
          echo "=== =m 计数 (应 > 0, 保留模块路线) ==="
          grep -c "=m" /tmp/ikconfig.txt || true
          MODCNT=$(find "$GITHUB_WORKSPACE/modules_install" -name '*.ko' | wc -l)
          echo "modules_install .ko 总数: $MODCNT"
          [ "$MODCNT" -gt 40 ] || { echo "模块数异常 (<40)!"; exit 1; }
          find "$GITHUB_WORKSPACE/modules_install" -name 'camera.ko' | grep -q camera || { echo "camera.ko 缺失! (相机必崩)"; exit 1; }
          echo "camera.ko 存在"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/artifacts/Image"
          cp /tmp/ikconfig.txt "$GITHUB_WORKSPACE/artifacts/Image.config"
          echo "$KREL" > "$GITHUB_WORKSPACE/artifacts/kernelrelease.txt"

      - name: 下载 HZE1 原厂 boot 模板 + magiskboot
        run: |
          mkdir -p "$GITHUB_WORKSPACE/inputs"
          cd "$GITHUB_WORKSPACE/inputs"
          curl --fail --location --retry 5 --retry-all-errors \
            --output boot_stock.img \
            "https://github.com/hc9903/s21-kernel-cn/releases/download/magisk-boot-G9910ZCUGHZE1/boot_stock.img"
          echo "ac4412244013fd821000205c4ef965295514b785430ce0b54b0df702005b1278  boot_stock.img" | sha256sum --check --strict
          curl --fail --location --retry 5 --retry-all-errors \
            --output Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk"
          echo "e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5  Magisk.apk" | sha256sum --check --strict
          python3 -m zipfile -e Magisk.apk magisk-apk
          cp magisk-apk/lib/x86_64/libmagiskboot.so magiskboot
          chmod 0755 magiskboot
          test -x magiskboot && echo "magiskboot ready ($(stat -c %s magiskboot) bytes)"

      - name: 打包 boot.img (保留原厂 ramdisk) + Odin tar
        env:
          KERNEL_IMAGE: ${{ github.workspace }}/artifacts/Image
          STOCK_BOOT: ${{ github.workspace }}/inputs/boot_stock.img
          MAGISKBOOT: ${{ github.workspace }}/inputs/magiskboot
          OUTPUT_DIR: ${{ github.workspace }}/flash-artifacts
          TARGET_KERNELRELEASE: 5.4.274${{ inputs.localversion }}
          EXPECTED_STOCK_BOOT_SHA256: ac4412244013fd821000205c4ef965295514b785430ce0b54b0df702005b1278
        run: bash scripts/repack_ksu_boot.sh

      - name: 打包 TWRP 刷机 zip (boot.img + 重编模块)
        env:
          BOOT_IMG: ${{ github.workspace }}/flash-artifacts/boot.img
          MODULES_ROOT: ${{ github.workspace }}/modules_install
          UPDATE_BINARY: ${{ github.workspace }}/scripts/twrp-update-binary
          OUTPUT_DIR: ${{ github.workspace }}/flash-artifacts
          KERNEL_RELEASE: 5.4.274${{ inputs.localversion }}
        run: bash scripts/pack_modules_twrp.sh

      - name: 附加构建证据
        run: |
          mkdir -p flash-artifacts/evidence
          cp artifacts/Image.config flash-artifacts/evidence/
          cp artifacts/kernelrelease.txt flash-artifacts/evidence/
          strings artifacts/Image | grep -m1 "Linux version" > flash-artifacts/evidence/compiler.txt
          find modules_install -name '*.ko' | sort > flash-artifacts/evidence/module-list.txt
          (
            cd flash-artifacts/evidence
            sha256sum Image.config kernelrelease.txt module-list.txt > evidence-SHA256SUMS.txt
          )

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU-modules-${{ github.run_id }}
          path: flash-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: 上传 GitHub Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cd flash-artifacts
          ls -la
          ZIP=$(ls KSU-modules-*.zip | head -1)
          RELEASE_TAG="ksu-modules-$RUN_ID"
          gh release create "$RELEASE_TAG" \
            "$ZIP" boot.img boot.tar NOTICE.txt SHA256SUMS \
            evidence/Image.config evidence/kernelrelease.txt evidence/module-list.txt \
            --repo "${{ github.repository }}" \
            --title "S21 KSU 保留模块内核 (Route b) run $RUN_ID" \
            --notes "保留模块 + 重编 + KernelSU v1.0.5 + 三星五补丁。版本串: 5.4.274${{ inputs.localversion }}。TWRP 刷入 zip。"
          echo "=== Release 已创建: $RELEASE_TAG ==="
