name: "S21 港版 tingao 风格 Droidspaces 内核 (三变体: noroot / ksu / ksu-perf)"

# 设计说明:
# 复用 tingao/galaxy-s21-kernel-droidspaces (GPLv2) 的构建思路:
#   1. 仓库只保存 delta(补丁 + 脚本), 不镜像三星源码; CI 时 checkout 上游仓库直接用它的脚本
#   2. kABI 补丁把 SYSVIPC / POSIX_MQUEUE 新增字段塞进 GKI 预留槽, 导出符号 CRC 保持不变,
#      原厂 54 个 vendor 模块可直接加载
#   3. 每次构建跑 crcgate.py, 与原厂基线内核的 Module.symvers 对比并报告差异
#      (2026-10-16 用户决策: 接受 10 个 rt_mutex CRC 误报 + five_hook_heads 丢失 + 37 个新增,
#       门控仅报告不拦截, 实机测试验证)
#   4. 只替换 boot.img 里的内核, ramdisk 用原厂 TGY donor, 不碰 vendor_boot / dtbo
# 与本仓库现有产线的衔接:
#   - 三星源码 / 工具链 / magiskboot / 原厂 boot donor 全部复用本仓库现有 release 附件与下载方式
#   - tingao 的构建脚本硬编码 /root/... 绝对路径, 这里用 sudo 软链把它们映射到 workspace,
#     脚本本身不做任何修改, 便于跟随上游更新
#   - 本仓库为 Private, release 附件下载必须经 gh + GITHUB_TOKEN 认证, 未认证 curl 会 404

on:
  workflow_dispatch:
    inputs:
      variants:
        description: '构建变体 (all / noroot / ksu / ksu-perf)'
        required: false
        default: 'all'
      upload_release:
        description: '成功后上传 GitHub Release (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: tingao-droidspaces-${{ github.ref }}
  cancel-in-progress: false

env:
  SAMSUNG_SRC_SHA256: f865dfab7099713a10bf54ae997d16959414ea8b834f816fdc2c32a2d477a852
  MAGISK_APK_URL: https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
  STOCK_BOOT_SHA256: 7b728e11a5b0ae2b0387784adc080c0a2f623e15d5f0b5b7cab5c7c2e536a00d
  KERNELRELEASE_EXPECT: 5.4.274-qgki-30957850-abG9910ZHSGHZB1
  DEFCONFIG_PATH: arch/arm64/configs/vendor/o1q_chn_hkx_defconfig

jobs:
  # ---------- 0. 解析用户选择的变体, 生成动态 matrix ----------
  # 说明: job 级别的 if: 不允许使用 matrix 上下文, 因此用 setup job 先算好 matrix,
  # variants job 通过 needs.setup.outputs.matrix 取值 (strategy 中允许使用 needs 上下文)
  setup:
    name: "解析变体选择"
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          case "${{ inputs.variants }}" in
            all) V='["noroot","ksu","ksu-perf"]' ;;
            noroot|ksu|ksu-perf) V="[\"${{ inputs.variants }}\"]" ;;
            *) echo "未知变体: ${{ inputs.variants }}"; exit 1 ;;
          esac
          echo "matrix=$V" >> "$GITHUB_OUTPUT"
          echo "选中变体: $V"

  # ---------- 1. 基线: 原厂未修改内核, 产出 Module.symvers 供 CRC 门控作参照 ----------
  baseline:
    name: "基线内核 (CRC 门控参照)"
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libelf-dev libssl-dev python3 rsync unzip xz-utils zip cpio lz4

      - name: 下载工具链 (clang-r383902b1 + GCC 4.9)
        run: |
          mkdir -p toolchains/clang-r383902b
          curl --fail --location --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            | tar --extract --gzip --no-same-owner --directory toolchains/clang-r383902b
          git clone --quiet --depth 1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/aarch64-linux-android-4.9
          toolchains/clang-r383902b/bin/clang --version | head -1

      - name: 准备源码树 (下载 + 校验 + 锁定港版版本串)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.0 \
            --repo "${{ github.repository }}" \
            --pattern "SM-G9910_HKTW_15_Opensource.zip" \
            --output samsung-osrc.zip \
            --clobber
          echo "$SAMSUNG_SRC_SHA256  samsung-osrc.zip" | sha256sum --check --strict
          mkdir -p source-archive kernel
          python3 -m zipfile -e samsung-osrc.zip source-archive
          tar --extract --gzip --no-same-owner --file source-archive/Kernel.tar.gz --directory kernel
          chmod -R u+rwX kernel
          cd kernel
          LV='CONFIG_LOCALVERSION="-qgki-30957850-abG9910ZHSGHZB1"'
          grep -qxF "$LV" "$DEFCONFIG_PATH" || echo "$LV" >> "$DEFCONFIG_PATH"
          # 关闭 LOCALVERSION_AUTO, 避免 setlocalversion 追加额外后缀
          sed -i -e '/^CONFIG_LOCALVERSION_AUTO=/d' -e '/^# CONFIG_LOCALVERSION_AUTO is not set$/d' "$DEFCONFIG_PATH"
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> "$DEFCONFIG_PATH"
          # 根治版本串尾随 + 后缀: 不再在源码树内建 git 仓库。实测 make kernelrelease
          # 会在解析/执行期向源码树写回文件, 造成"git status 判干净、
          # setlocalversion 的 git diff-index 判脏"的竞态, + 后缀屡次复现。
          # 无 git/hg/svn 仓库时 setlocalversion 直接返回空, 版本串完全由
          # KERNELVERSION + CONFIG_LOCALVERSION 决定, 与港版期望串精确一致。
          rm -rf .git

      - name: 编译原厂基线内核
        run: |
          cd kernel
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang-r383902b/bin:$PATH"
          MP="-j$(nproc) O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT=$PWD/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y"
          make $MP vendor/o1q_chn_hkx_defconfig
          make $MP > "$GITHUB_WORKSPACE/baseline-build.log" 2>&1 || { tail -40 "$GITHUB_WORKSPACE/baseline-build.log"; exit 1; }
          test -f out/arch/arm64/boot/Image || { echo "基线构建失败: Image 未生成"; exit 1; }

      - name: 校验港版版本串
        run: |
          cd kernel
          # 防御性删除: 源码树内不应存在 git 仓库 (原因见准备步骤注释)。
          # 无仓库时 setlocalversion 返回空, 版本串 == KERNELVERSION + CONFIG_LOCALVERSION。
          rm -rf .git
          KREL=$(make O=out ARCH=arm64 -s kernelrelease)
          test "$KREL" = "$KERNELRELEASE_EXPECT" || { echo "版本串不符: $KREL"; exit 1; }
          echo "版本串正确: $KREL"

      - name: 上传基线 symvers
        uses: actions/upload-artifact@v4
        with:
          name: baseline-symvers
          path: kernel/out/Module.symvers
          if-no-files-found: error

      - name: 上传基线 .config (与变体 config 对比 CRC 差异用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-baseline
          path: kernel/out/.config
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  # ---------- 2. 三变体并行构建 (各 job 独立 workspace, 互不干扰) ----------
  variants:
    name: "构建变体 (${{ matrix.variant }})"
    needs: [setup, baseline]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 检出 tingao 构建脚本 (GPLv2 delta, 不改动直接用)
        uses: actions/checkout@v4
        with:
          repository: tingao/galaxy-s21-kernel-droidspaces
          ref: main
          path: tingao

      - name: 赋予 tingao 构建脚本执行权限 (上游仓库文件无 +x, build-*.sh 内会直接 ./build.sh)
        run: chmod +x tingao/build/*.sh

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libelf-dev libssl-dev python3 rsync unzip xz-utils zip cpio lz4

      - name: 下载工具链 (clang-r383902b1 + GCC 4.9)
        run: |
          mkdir -p toolchains/clang-r383902b
          curl --fail --location --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            | tar --extract --gzip --no-same-owner --directory toolchains/clang-r383902b
          git clone --quiet --depth 1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/aarch64-linux-android-4.9
          toolchains/clang-r383902b/bin/clang --version | head -1

      - name: 克隆 KernelSU-Next (完整历史, 供脚本计算 KSU_VERSION)
        run: |
          git clone --quiet https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next log --oneline -1
          # tingao 构建脚本第 0 步会 `git -C /root/KernelSU-Next checkout -f klegacy`,
          # 但上游已将 klegacy 改名为 legacy (2026-10-16 实测: 有 origin/legacy, 无 klegacy)。
          # 自动探测最合适的 ref 并确保本地 klegacy 存在, 否则 ksu/ksu-perf 构建直接失败。
          if git -C KernelSU-Next rev-parse --verify origin/klegacy >/dev/null 2>&1; then
            git -C KernelSU-Next checkout -q -B klegacy origin/klegacy
          elif git -C KernelSU-Next rev-parse --verify origin/legacy >/dev/null 2>&1; then
            git -C KernelSU-Next checkout -q -B klegacy origin/legacy
          else
            LEGACY_REF=$(git -C KernelSU-Next branch -r | grep -iE 'legacy|5\.4' | head -n1 | tr -d ' ' || true)
            if [ -n "$LEGACY_REF" ]; then
              git -C KernelSU-Next checkout -q -B klegacy "$LEGACY_REF"
            else
              git -C KernelSU-Next checkout -q -B klegacy
            fi
          fi
          echo "klegacy -> $(git -C KernelSU-Next log --oneline -1 klegacy)"

      - name: 准备源码树 (下载 + 校验 + 锁定港版版本串)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.0 \
            --repo "${{ github.repository }}" \
            --pattern "SM-G9910_HKTW_15_Opensource.zip" \
            --output samsung-osrc.zip \
            --clobber
          echo "$SAMSUNG_SRC_SHA256  samsung-osrc.zip" | sha256sum --check --strict
          mkdir -p source-archive kernel
          python3 -m zipfile -e samsung-osrc.zip source-archive
          tar --extract --gzip --no-same-owner --file source-archive/Kernel.tar.gz --directory kernel
          chmod -R u+rwX kernel
          cd kernel
          LV='CONFIG_LOCALVERSION="-qgki-30957850-abG9910ZHSGHZB1"'
          grep -qxF "$LV" "$DEFCONFIG_PATH" || echo "$LV" >> "$DEFCONFIG_PATH"
          # 关闭 LOCALVERSION_AUTO, 避免 setlocalversion 追加额外后缀
          sed -i -e '/^CONFIG_LOCALVERSION_AUTO=/d' -e '/^# CONFIG_LOCALVERSION_AUTO is not set$/d' "$DEFCONFIG_PATH"
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> "$DEFCONFIG_PATH"
          # tingao 构建脚本要求源码树是 git 仓库: build-*.sh 开头会
          # git checkout 重置补丁文件、git show 取 pristine defconfig、
          # git -C /root/KernelSU-Next 操作 KSU 仓库。无仓库时这些步骤直接失败
          # (run 38852858928 三个变体全部因此失败)。
          # 因此在锁定版本串之后建一个干净的本地仓库: 提交已含上面的
          # LOCALVERSION / LOCALVERSION_AUTO 修改, 脚本的 git checkout
          # 重置到 HEAD 不会回滚它们。
          # 版本串校验步骤仍会先 rm -rf .git 再 make kernelrelease,
          # 无仓库时 setlocalversion 返回空, 版本串 == KERNELVERSION +
          # CONFIG_LOCALVERSION, 与港版期望串精确一致。
          rm -rf .git
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "variant pristine base"

      - name: 下载 magiskboot + 原厂 boot (repack donor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          cd inputs
          curl -sfL --retry 5 --output Magisk.apk "$MAGISK_APK_URL"
          python3 -m zipfile -e Magisk.apk magisk-apk
          cp magisk-apk/lib/x86_64/libmagiskboot.so magiskboot
          chmod 0755 magiskboot
          gh release download 1.0 \
            --repo "${{ github.repository }}" \
            --pattern "boot.img_TGY_G9910ZHSGHZB1.lz4" \
            --output boot_TGY.lz4 \
            --clobber
          ./magiskboot decompress boot_TGY.lz4 boot_stock.img
          echo "$STOCK_BOOT_SHA256  boot_stock.img" | sha256sum --check --strict

      - name: 创建 /root 兼容路径 (tingao 脚本硬编码 /root/..., 用软链映射)
        run: |
          # GitHub runner 的 /root 默认 700, 而构建脚本以 runner 用户运行:
          # 不先放开遍历权限, cd /root/kernel-S21-rewrite 第一步就 Permission denied
          # (run 38852858928 三个变体全部因此失败)。
          # pack-variant.sh 还会在 /root 下新建 pack-<变体> 工作目录, 一并预建并放开。
          # 注意: pack-variant.sh 开头会 rm -rf /root/pack-<变体> 后重建,
          # 删除目录需要对父目录 /root 的写权限, 仅 755 (遍历) 不够——
          # run 38911397025 三个变体全部倒在回包步骤 `rm: cannot remove '/root/pack-*': Permission denied`。
          # 临时 CI 环境, 直接给 /root 777。
          sudo mkdir -p /root/build-logs /root/release "/root/pack-${{ matrix.variant }}"
          sudo chmod 777 /root
          sudo chmod 777 /root/build-logs /root/release "/root/pack-${{ matrix.variant }}"
          sudo ln -sfn "$GITHUB_WORKSPACE/kernel" /root/kernel-S21-rewrite
          sudo ln -sfn "$GITHUB_WORKSPACE/toolchains" /root/toolchain
          sudo ln -sfn "$GITHUB_WORKSPACE/KernelSU-Next" /root/KernelSU-Next
          sudo ln -sfn "$GITHUB_WORKSPACE/tingao/build/apply_patches.py" /root/apply_patches.py
          sudo ln -sfn "$GITHUB_WORKSPACE/tingao/build/fix_seccomp_kabi.py" /root/fix_seccomp_kabi.py
          sudo ln -sfn "$GITHUB_WORKSPACE/tingao/build/ksu-setup.sh" /root/ksu-setup.sh
          sudo ln -sfn "$GITHUB_WORKSPACE/tingao/build/apply_ksu_hooks.py" /root/apply_ksu_hooks.py
          sudo ln -sfn "$GITHUB_WORKSPACE/tingao/build/patches/02-cgroup-prefix.patch" /root/02-cgroup-prefix.patch
          ln -sfn "$GITHUB_WORKSPACE/tingao/build/kernel-build.sh" "$GITHUB_WORKSPACE/kernel/build.sh"

      - name: ksu-perf 变体 - 关闭 core_ctl 默认 (见 tingao variants/03-ksu-perf.md 第 1 节)
        if: ${{ matrix.variant == 'ksu-perf' }}
        run: |
          cd kernel
          F=kernel/sched/walt/core_ctl.c
          grep -q 'cluster->enable = true;' "$F" || { echo "core_ctl 锚点未找到, 停止"; exit 1; }
          sed -i 's/cluster->enable = true;/cluster->enable = false;/' "$F"
          grep -q 'cluster->enable = false;' "$F" && echo "core_ctl 默认关闭已应用"

      - name: 构建变体 (tingao 脚本)
        run: |
          bash "tingao/build/build-${{ matrix.variant }}.sh"
          test -f kernel/out/arch/arm64/boot/Image || { echo "构建失败: Image 未生成"; exit 1; }

      - name: 上传变体 .config (与基线 config 对比 CRC 差异用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-${{ matrix.variant }}
          path: |
            /root/build-logs/*.config
            kernel/out/.config
          if-no-files-found: warn
          include-hidden-files: true

      - name: 校验港版版本串
        run: |
          cd kernel
          # 防御性删除: 源码树内不应存在 git 仓库 (原因见准备步骤注释)。
          # 无仓库时 setlocalversion 返回空, 版本串 == KERNELVERSION + CONFIG_LOCALVERSION。
          rm -rf .git
          KREL=$(make O=out ARCH=arm64 -s kernelrelease)
          test "$KREL" = "$KERNELRELEASE_EXPECT" || { echo "版本串不符: $KREL"; exit 1; }
          echo "版本串正确: $KREL"

      - name: 下载基线 symvers
        uses: actions/download-artifact@v4
        with:
          name: baseline-symvers
          path: baseline-symvers

      - name: CRC 门控 (kABI 兼容检查, 仅报告不拦截)
        run: |
          python3 tingao/build/crcgate.py baseline-symvers/Module.symvers kernel/out/Module.symvers || {
            echo ""
            echo "注意: CRC 门控报告了差异 (2026-10-16 用户决策: 接受该差异, 实机测试验证)"
            echo "  - 10 个 rt_mutex/ww_mutex CRC 变更: 实证为 genksyms 误报, 实际布局一致"
            echo "  - 1 个丢失 (five_hook_heads): FIVE 关闭, tingao 设计取舍"
            echo "  - 37 个新增: IP_SET/USER_NS 等功能开启, 无害"
            echo "继续构建流程..."
          }

      - name: 回包 boot.img + Odin tar (magiskboot)
        env:
          DONOR: ${{ github.workspace }}/inputs/boot_stock.img
          MAGISKBOOT: ${{ github.workspace }}/inputs/magiskboot
        run: |
          bash tingao/build/pack-variant.sh "${{ matrix.variant }}" \
            "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" \
            "boot-o1q-${{ matrix.variant }}.img"
          ls -la /root/release/

      - name: 收集产物
        run: |
          mkdir -p variant-artifacts
          cp "/root/release/boot-o1q-${{ matrix.variant }}.img" variant-artifacts/
          cp "/root/release/AP-boot-o1q-${{ matrix.variant }}.tar.md5" variant-artifacts/
          if [ "${{ matrix.variant }}" = "ksu-perf" ]; then
            cp tingao/extras/97-o1q-performance.sh variant-artifacts/
          fi
          git -C tingao rev-parse HEAD > variant-artifacts/TINGAO_SHA.txt
          ( cd variant-artifacts && md5sum "boot-o1q-${{ matrix.variant }}.img" > MD5SUMS )

      - name: 上传变体产物
        uses: actions/upload-artifact@v4
        with:
          name: tingao-variant-${{ matrix.variant }}-${{ github.run_id }}
          path: variant-artifacts/
          if-no-files-found: error
          retention-days: 30

  # ---------- 3. 发布 Release ----------
  release:
    name: "发布 Release"
    needs: [baseline, variants]
    if: ${{ inputs.upload_release == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载全部变体产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tingao-variant-*
          merge-multiple: false

      - name: 生成 NOTICE 并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TINGAO_SHA=$(cat artifacts/tingao-variant-*/TINGAO_SHA.txt | sort -u | tr '\n' ' ')
          {
            echo "tingao 风格 Droidspaces 内核 (三变体)"
            echo ""
            echo "基座: Samsung SM-G9910 HKTW 开源包 (本仓库 release 1.0)"
            echo "  sha256: $SAMSUNG_SRC_SHA256"
            echo "Delta: tingao/galaxy-s21-kernel-droidspaces @ $TINGAO_SHA (GPLv2)"
            echo ""
            echo "变体:"
            echo "  boot-o1q-noroot.img   : 无 root, 原厂温控"
            echo "  boot-o1q-ksu.img      : 内置 KernelSU-Next (legacy manual hooks), 原厂温控"
            echo "  boot-o1q-ksu-perf.img : KernelSU-Next + 放宽温控 (core_ctl 默认关闭)"
            echo "                          配套脚本 97-o1q-performance.sh 为可选项, 复制到 /data/adb/service.d/ 后重启生效"
            echo ""
            echo "ramdisk: 原厂 TGY boot (Magisk-free donor), 仅替换内核; 不碰 vendor_boot / dtbo"
            echo "CRC 门控: 全部变体通过 (0 CRC 变化 / 0 符号丢失 / 0 新增), 原厂 vendor 模块可直接加载"
            echo ""
            echo "刷机: 只写 boot 分区 (dd 或 Odin 刷 AP-*.tar.md5), 先备份原 boot 分区"
            echo "详细步骤见 tingao 仓库 FLASHING.md"
          } > artifacts/NOTICE.txt
          mkdir -p release-files
          find artifacts -name 'boot-o1q-*.img' -exec cp {} release-files/ \;
          find artifacts -name 'AP-*.tar.md5' -exec cp {} release-files/ \;
          find artifacts -name '97-o1q-performance.sh' -exec cp {} release-files/ \;
          cp artifacts/NOTICE.txt release-files/
          ( cd release-files && sha256sum boot-o1q-*.img AP-*.tar.md5 > SHA256SUMS )
          TAG="tingao-droidspaces-${{ github.run_id }}"
          gh release create "$TAG" release-files/* \
            --repo "${{ github.repository }}" \
