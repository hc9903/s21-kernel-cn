name: "S21 ABI 对比 (stock vs Route b 关安全+KSU)"

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: 'Route b 版本串 (匹配 HZE1)'
        required: false
        default: '-qgki-2370012-abG9910ZCUGHZE1'
      ksu_tag:
        description: 'KernelSU tag (5.4 用 v1.0.5)'
        required: false
        default: 'v1.0.5'

permissions:
  contents: write

concurrency:
  group: abi-compare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 检出仓库 (脚本)
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libelf-dev libssl-dev \
            python3 rsync unzip xz-utils zip cpio
          sudo apt-get install -y libncurses5 libtinfo5 2>/dev/null || true
          [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] || \
            sudo ln -sf libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          [ -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] || \
            sudo ln -sf libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: 下载工具链 (clang r383902b1 + GCC 4.9)
        run: |
          mkdir -p toolchains/clang toolchains/gcc64
          curl --fail --location --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            | tar --extract --gzip --no-same-owner --directory toolchains/clang
          git clone --quiet --depth 1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64
          toolchains/clang/bin/clang --version

      - name: 下载并校验三星 CHN 源码 (G9910ZCUBHYDA)
        run: |
          for attempt in 1 2 3; do
            if curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
              --output samsung-osrc.zip \
              "https://github.com/hc9903/s21-kernel-cn/releases/download/1.0/SM-G9910_CHN_15_Opensource.zip" 2>/tmp/curl_err.log; then
              break
            fi
            echo "第 $attempt 次下载失败: $(tail -2 /tmp/curl_err.log)"
            sleep 20
          done
          echo "26f6282ae302eb7fafc18c6e1115fcfeed315753b8e915af1d04ceb0f166d994  samsung-osrc.zip" | sha256sum --check --strict
          mkdir source-archive kernel
          python3 -m zipfile -e samsung-osrc.zip source-archive
          tar --extract --gzip --no-same-owner \
            --file source-archive/Kernel.tar.gz --directory kernel
          chmod -R u+rwX kernel

      - name: 编译 STOCK (原厂 defconfig, 关 KSU, 关安全改动)
        run: |
          cd kernel
          export ARCH=arm64
          CLANG_BIN=$(dirname "$(find "$GITHUB_WORKSPACE/toolchains" -maxdepth 4 -type f -path '*/bin/clang' | head -n1)")
          CROSS="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          MP="-j$(nproc) O=out DTC_EXT=$PWD/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"
          COMMON="CROSS_COMPILE=$CROSS REAL_CC=$CLANG_BIN/clang CLANG_TRIPLE=aarch64-linux-gnu- CONFIG_SECTION_MISMATCH_WARN_ONLY=y DISABLE_WRAPPER=1"
          make $MP $COMMON vendor/o1q_chn_openx_defconfig
          make $MP $COMMON > "$GITHUB_WORKSPACE/stock-build.log" 2>&1 || { echo "=== stock 构建失败 ==="; tail -150 "$GITHUB_WORKSPACE/stock-build.log"; exit 1; }
          cp out/Module.symvers "$GITHUB_WORKSPACE/stock.symvers"
          echo "=== stock Module.symvers 已保存: $(wc -l < "$GITHUB_WORKSPACE/stock.symvers") 行 ==="
          grep -c "	vmlinux	" "$GITHUB_WORKSPACE/stock.symvers" || true

      - name: 校验 stock ABI 指纹 (应匹配 HZE1 a41af856)
        run: |
          python3 scripts/verify_vmlinux_abi.py "$GITHUB_WORKSPACE/stock.symvers" \
            --expected-count 13661 \
            --expected-sha256 a41af8567360e2420c4d11d2586fe296c948f2d46a18f3371afb0d8909d47694 \
            --report "$GITHUB_WORKSPACE/stock-abi-report.txt" || true
          cat "$GITHUB_WORKSPACE/stock-abi-report.txt"

      - name: 集成 KernelSU ${{ inputs.ksu_tag }} + 三星五补丁
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/tiann/KernelSU/${{ inputs.ksu_tag }}/kernel/setup.sh" -o /tmp/ksu_setup.sh
          sh /tmp/ksu_setup.sh "${{ inputs.ksu_tag }}"
          grep -q "KSU_COMPAT_HAS_CURRENT_SID" KernelSU/kernel/Makefile || \
            echo "ccflags-y += -DKSU_COMPAT_HAS_CURRENT_SID" >> KernelSU/kernel/Makefile
          python3 "$GITHUB_WORKSPACE/scripts/patch_ksu_samsung.py"

      - name: 配置 Route b (保留 =m + 关安全 + KSU + 版本串 HZE1)
        run: |
          cd kernel
          python3 "$GITHUB_WORKSPACE/scripts/kokubanify.py" \
            arch/arm64/configs/vendor/o1q_chn_openx_defconfig \
            none \
            "${{ inputs.localversion }}" \
            "true" \
            "true"
          grep -E "CONFIG_KSU=|CONFIG_LOCALVERSION=" arch/arm64/configs/vendor/o1q_chn_openx_defconfig | tail -3

      - name: 重编 Route b (增量) + 保存 routeb.symvers
        run: |
          cd kernel
          export ARCH=arm64
          CLANG_BIN=$(dirname "$(find "$GITHUB_WORKSPACE/toolchains" -maxdepth 4 -type f -path '*/bin/clang' | head -n1)")
          CROSS="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          MP="-j$(nproc) O=out DTC_EXT=$PWD/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"
          COMMON="CROSS_COMPILE=$CROSS REAL_CC=$CLANG_BIN/clang CLANG_TRIPLE=aarch64-linux-gnu- CONFIG_SECTION_MISMATCH_WARN_ONLY=y DISABLE_WRAPPER=1"
          make $MP $COMMON vendor/o1q_chn_openx_defconfig
          make $MP $COMMON > "$GITHUB_WORKSPACE/routeb-build.log" 2>&1 || { echo "=== routeb 构建失败 ==="; tail -150 "$GITHUB_WORKSPACE/routeb-build.log"; exit 1; }
          cp out/Module.symvers "$GITHUB_WORKSPACE/routeb.symvers"
          echo "=== routeb Module.symvers 已保存: $(wc -l < "$GITHUB_WORKSPACE/routeb.symvers") 行 ==="

      - name: 逐符号 ABI 对比
        id: compare
        run: |
          python3 scripts/compare_abi.py \
            "$GITHUB_WORKSPACE/stock.symvers" \
            "$GITHUB_WORKSPACE/routeb.symvers" \
            "$GITHUB_WORKSPACE/abi-compare-report.txt" || true
          echo "=== 对比报告已生成 ==="

      - name: 上传 artifact (symvers + 报告)
        uses: actions/upload-artifact@v4
        with:
          name: abi-compare-${{ github.run_id }}
          path: |
            abi-compare-report.txt
            stock-abi-report.txt
            stock.symvers
            routeb.symvers
          if-no-files-found: error
          retention-days: 30

      - name: 上传 GitHub Release (报告 + symvers)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh release create "abi-compare-$RUN_ID" \
            abi-compare-report.txt stock-abi-report.txt stock.symvers routeb.symvers \
            --repo "${{ github.repository }}" \
            --title "ABI 对比 (stock vs Route b) run $RUN_ID" \
            --notes "逐符号对比 stock HZE1 vs Route b(关安全+KSU) 的 vmlinux 导出 CRC, 判断 stock 模块能否加载。"
