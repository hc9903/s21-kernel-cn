name: HZE1 DroidSpaces compatibility build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hze1-droidspaces-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - droidspaces

    steps:
      - name: Checkout compatibility scripts
        uses: actions/checkout@v4

      - name: Resolve fixed compatibility inputs
        id: compat
        run: |
          python3 scripts/resolve_hze1_compat.py \
            --manifest sources/sm-g9910-hze1-compat.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git libelf-dev libssl-dev \
            python3 rsync unzip xz-utils zip
          sudo apt-get install -y libncurses5 libtinfo5 2>/dev/null || true
          [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] || \
            sudo ln -sf libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          [ -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] || \
            sudo ln -sf libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Download and verify published CHN source
        env:
          SOURCE_URL: ${{ steps.compat.outputs.published_source_url }}
          SOURCE_SHA256: ${{ steps.compat.outputs.published_source_sha256 }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output samsung-osrc.zip "$SOURCE_URL"
          echo "$SOURCE_SHA256  samsung-osrc.zip" | sha256sum --check --strict
          mkdir source-archive kernel
          python3 -m zipfile -e samsung-osrc.zip source-archive
          tar --extract --gzip --no-same-owner \
            --file source-archive/Kernel.tar.gz --directory kernel
          chmod -R u+rwX kernel

      - name: Download Samsung toolchain
        run: |
          mkdir -p toolchains/clang
          curl --fail --location --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            | tar --extract --gzip --no-same-owner --directory toolchains/clang
          git clone --quiet --depth 1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64
          toolchains/clang/bin/clang --version
          toolchains/clang/bin/ld.lld --version

      - name: Build and verify ${{ matrix.variant }}
        env:
          VARIANT: ${{ matrix.variant }}
          DEFCONFIG: ${{ steps.compat.outputs.defconfig }}
          TARGET_FIRMWARE: ${{ steps.compat.outputs.target_firmware }}
          SOURCE_FIRMWARE: ${{ steps.compat.outputs.published_source_firmware }}
          TARGET_LOCALVERSION: ${{ steps.compat.outputs.target_localversion }}
          EXPECTED_KERNELRELEASE: ${{ steps.compat.outputs.expected_kernelrelease }}
          PROVENANCE_NOTICE: ${{ steps.compat.outputs.provenance_notice }}
        run: scripts/build_hze1_compat.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hze1-${{ matrix.variant }}-build-log-${{ github.run_id }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: hze1-${{ matrix.variant }}-${{ github.run_id }}
          path: artifacts/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30

  verify-abi:
    name: Verify HZE1 and DroidSpaces ABI
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout ABI verification scripts
        uses: actions/checkout@v4

      - name: Resolve fixed compatibility inputs
        id: compat
        run: |
          python3 scripts/resolve_hze1_compat.py \
            --manifest sources/sm-g9910-hze1-compat.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Download baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: hze1-baseline-${{ github.run_id }}
          path: compare/baseline

      - name: Download DroidSpaces artifact
        uses: actions/download-artifact@v4
        with:
          name: hze1-droidspaces-${{ github.run_id }}
          path: compare/droidspaces

      - name: Verify HZE1 stock vmlinux ABI fingerprint
        env:
          EXPECTED_COUNT: ${{ steps.compat.outputs.hze1_vmlinux_export_count }}
          EXPECTED_SHA256: ${{ steps.compat.outputs.hze1_vmlinux_export_sha256 }}
        run: |
          mkdir -p abi-report
          python3 scripts/verify_vmlinux_abi.py \
            compare/baseline/Module.symvers \
            --expected-count "$EXPECTED_COUNT" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --report abi-report/hze1-vmlinux-fingerprint.txt \
            --canonical-out abi-report/baseline-vmlinux-exports.txt

      - name: Verify exact DroidSpaces ABI delta
        run: |
          python3 scripts/compare_symvers.py \
            compare/baseline/Module.symvers \
            compare/droidspaces/Module.symvers \
            --expected-added-file sources/hze1-droidspaces-added-symbols.txt \
            --report abi-report/droidspaces-delta.txt

      - name: Record provenance
        env:
          PROVENANCE_NOTICE: ${{ steps.compat.outputs.provenance_notice }}
          TARGET_FIRMWARE: ${{ steps.compat.outputs.target_firmware }}
          SOURCE_FIRMWARE: ${{ steps.compat.outputs.published_source_firmware }}
        run: |
          {
            echo "$PROVENANCE_NOTICE"
            echo "Target firmware: $TARGET_FIRMWARE"
            echo "Published source firmware: $SOURCE_FIRMWARE"
            echo "Baseline and DroidSpaces kernel release:"
            cat compare/baseline/kernelrelease.txt
            cat compare/droidspaces/kernelrelease.txt
          } >abi-report/PROVENANCE.txt

      - name: Upload ABI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hze1-abi-evidence-${{ github.run_id }}
          path: abi-report/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Repack verified HZE1 boot images
    needs: verify-abi
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@v4

      - name: Resolve fixed compatibility inputs
        id: compat
        run: |
          python3 scripts/resolve_hze1_compat.py \
            --manifest sources/sm-g9910-hze1-compat.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Download verified DroidSpaces build
        uses: actions/download-artifact@v4
        with:
          name: hze1-droidspaces-${{ github.run_id }}
          path: verified/droidspaces

      - name: Download ABI evidence
        uses: actions/download-artifact@v4
        with:
          name: hze1-abi-evidence-${{ github.run_id }}
          path: verified/abi

      - name: Download and verify HZE1 boot templates
        env:
          STOCK_URL: ${{ steps.compat.outputs.hze1_stock_boot_url }}
          STOCK_SHA256: ${{ steps.compat.outputs.hze1_stock_boot_sha256 }}
          MAGISK_URL: ${{ steps.compat.outputs.magisk_boot_url }}
          MAGISK_SHA256: ${{ steps.compat.outputs.magisk_boot_sha256 }}
        run: |
          mkdir -p inputs
          curl --fail --location --retry 5 --retry-all-errors \
            --output inputs/boot_stock.img "$STOCK_URL"
          curl --fail --location --retry 5 --retry-all-errors \
            --output inputs/magisk_patched.img "$MAGISK_URL"
          echo "$STOCK_SHA256  inputs/boot_stock.img" | sha256sum --check --strict
          echo "$MAGISK_SHA256  inputs/magisk_patched.img" | sha256sum --check --strict

      - name: Download and verify Magisk v30.7 tooling
        env:
          MAGISK_APK_URL: ${{ steps.compat.outputs.magisk_apk_url }}
          MAGISK_APK_SHA256: ${{ steps.compat.outputs.magisk_apk_sha256 }}
          MAGISKBOOT_SHA256: ${{ steps.compat.outputs.magiskboot_x86_64_sha256 }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output inputs/Magisk.apk "$MAGISK_APK_URL"
          echo "$MAGISK_APK_SHA256  inputs/Magisk.apk" | sha256sum --check --strict
          mkdir -p inputs/magisk-apk inputs/tools
          python3 -m zipfile -e inputs/Magisk.apk inputs/magisk-apk
          cp inputs/magisk-apk/lib/x86_64/libmagiskboot.so inputs/tools/magiskboot
          chmod 0755 inputs/tools/magiskboot
          echo "$MAGISKBOOT_SHA256  inputs/tools/magiskboot" | sha256sum --check --strict

      - name: Repack and read back boot images
        env:
          KERNEL_IMAGE: ${{ github.workspace }}/verified/droidspaces/Image
          STOCK_BOOT: ${{ github.workspace }}/inputs/boot_stock.img
          MAGISK_BOOT: ${{ github.workspace }}/inputs/magisk_patched.img
          MAGISKBOOT: ${{ github.workspace }}/inputs/tools/magiskboot
          OUTPUT_DIR: ${{ github.workspace }}/flash-artifacts
          TARGET_KERNELRELEASE: ${{ steps.compat.outputs.expected_kernelrelease }}
          EXPECTED_STOCK_BOOT_SHA256: ${{ steps.compat.outputs.hze1_stock_boot_sha256 }}
          EXPECTED_STOCK_BOOT_SIZE: ${{ steps.compat.outputs.hze1_stock_boot_size }}
          EXPECTED_STOCK_KERNEL_SHA256: ${{ steps.compat.outputs.hze1_stock_kernel_sha256 }}
          EXPECTED_STOCK_KERNEL_SIZE: ${{ steps.compat.outputs.hze1_stock_kernel_size }}
          EXPECTED_STOCK_RAMDISK_SHA256: ${{ steps.compat.outputs.hze1_stock_ramdisk_sha256 }}
          EXPECTED_MAGISK_BOOT_SHA256: ${{ steps.compat.outputs.magisk_boot_sha256 }}
          EXPECTED_MAGISK_BOOT_SIZE: ${{ steps.compat.outputs.magisk_boot_size }}
          EXPECTED_MAGISK_RAMDISK_SHA256: ${{ steps.compat.outputs.magisk_ramdisk_sha256 }}
          MAGISK_VERSION: ${{ steps.compat.outputs.magisk_version }}
          PROVENANCE_NOTICE: ${{ steps.compat.outputs.provenance_notice }}
        run: scripts/repack_hze1_boot.sh

      - name: Attach build and ABI evidence
        run: |
          mkdir -p flash-artifacts/evidence
          cp verified/droidspaces/Image.config flash-artifacts/evidence/
          cp verified/droidspaces/Module.symvers flash-artifacts/evidence/
          cp verified/droidspaces/kernelrelease.txt flash-artifacts/evidence/
          cp verified/droidspaces/compiler.txt flash-artifacts/evidence/
          cp verified/abi/*.txt flash-artifacts/evidence/
          (
            cd flash-artifacts/evidence
            sha256sum \
              Image.config Module.symvers PROVENANCE.txt \
              baseline-vmlinux-exports.txt compiler.txt \
              droidspaces-delta.txt hze1-vmlinux-fingerprint.txt \
              kernelrelease.txt >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload gated HZE1 compatibility package
        uses: actions/upload-artifact@v4
        with:
          name: HZE1-DroidSpaces-ABI-verified-${{ github.run_id }}
          path: flash-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
