name: CHN 固件精确版 (Samsung 开源包 + 全量模块)

on:
  workflow_dispatch:
    inputs:
      fragment_file:
        description: 'Droidspaces 配置片段 (none=不加)'
        required: false
        default: 'droidspaces.config'
      ksu:
        description: '集成 KernelSU v1.0.5 (含三星适配补丁)'
        required: false
        default: 'false'
      localversion:
        description: '内核版本号后缀 (必须与手机一致)'
        required: false
        default: '-qgki-2370012-abG9910ZCUBHYDA'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: 检出仓库 (配置片段 + 修复脚本)
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libssl-dev python3 rsync zip
          sudo apt-get install -y libncurses5 libtinfo5 2>/dev/null || true
          [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] || sudo ln -sf libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          [ -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] || sudo ln -sf libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: 下载工具链 (clang r383902b1 + GCC 4.9)
        run: |
          mkdir -p toolchains
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902b1.tar.gz" | tar -xz -C toolchains
          git clone --depth=1 -b android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchains/gcc64

      - name: 下载并解压三星 CHN 源码 (与手机固件 ZCUBHYDA 精确匹配)
        run: |
          mkdir -p kernel && cd kernel
          wget -q -O source.zip "https://github.com/hc9903/s21-kernel-cn/releases/download/1.0/SM-G9910_CHN_15_Opensource.zip"
          unzip -o source.zip Kernel.tar.gz
          tar -xzf Kernel.tar.gz
          rm -f source.zip Kernel.tar.gz
          chmod -R 755 .

      - name: 应用 kABI 修复 (SYSVIPC/POSIX_MQUEUE 布局保护)
        run: |
          cd kernel
          python3 "$GITHUB_WORKSPACE/scripts/apply_kabi_fix.py"

      - name: 集成 KernelSU v1.0.5 + 三星适配
        if: ${{ github.event.inputs.ksu == 'true' }}
        run: |
          cd kernel
          curl -sL "https://raw.githubusercontent.com/tiann/KernelSU/v1.0.5/kernel/setup.sh" -o /tmp/ksu_setup.sh
          sh /tmp/ksu_setup.sh "v1.0.5"
          grep -q "KSU_COMPAT_HAS_CURRENT_SID" KernelSU/kernel/Makefile || \
            echo "ccflags-y += -DKSU_COMPAT_HAS_CURRENT_SID" >> KernelSU/kernel/Makefile
          python3 "$GITHUB_WORKSPACE/scripts/patch_ksu_samsung.py"

      - name: 注入 Droidspaces 配置 + 版本号
        run: |
          cd kernel
          DEF="arch/arm64/configs/vendor/o1q_chn_openx_defconfig"
          FRAG="${{ github.event.inputs.fragment_file }}"
          if [ -n "$FRAG" ] && [ "$FRAG" != "none" ]; then
            cat "$GITHUB_WORKSPACE/$FRAG" >> "$DEF"
          fi
          if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
            echo "CONFIG_KSU=y" >> "$DEF"
          fi
          LV="${{ github.event.inputs.localversion }}"
          [[ "$LV" != -* ]] && LV="-$LV"
          echo "" >> "$DEF"
          echo "CONFIG_LOCALVERSION=\"$LV\"" >> "$DEF"

      - name: 编译内核 + 全量模块 (含 techpack 相机/音频)
        run: |
          cd kernel
          export ARCH=arm64
          CLANG_BIN=$(dirname "$(find $GITHUB_WORKSPACE/toolchains -maxdepth 3 -type f -path '*/bin/clang' | head -n1)")
          CROSS=$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-
          MP="-j$(nproc) O=out DTC_EXT=$PWD/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"
          make $MP CROSS_COMPILE=$CROSS REAL_CC=$CLANG_BIN/clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y DISABLE_WRAPPER=1 \
            vendor/o1q_chn_openx_defconfig
          make $MP CROSS_COMPILE=$CROSS REAL_CC=$CLANG_BIN/clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y DISABLE_WRAPPER=1
          # 全量模块 (camera.ko / 音频 dlkm / wifi dhd / ...) —— 关键!
          make $MP CROSS_COMPILE=$CROSS REAL_CC=$CLANG_BIN/clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y DISABLE_WRAPPER=1 \
            INSTALL_MOD_PATH=$GITHUB_WORKSPACE/modinst INSTALL_MOD_STRIP=1 \
            modules modules_install

      - name: 编译后验证
        run: |
          cd kernel
          echo "=== kernelrelease ==="
          make O=out ARCH=arm64 -s kernelrelease
          echo "=== 关键配置 ==="
          grep -E "CONFIG_SYSVIPC|CONFIG_USER_NS|CONFIG_PID_NS|CONFIG_IPC_NS|CONFIG_POSIX_MQUEUE|CONFIG_DEVTMPFS|CONFIG_FAIR_GROUP_SCHED|CONFIG_NF_TABLES|CONFIG_KSU" out/.config | grep -v "^#"
          echo "=== 模块统计 ==="
          find $GITHUB_WORKSPACE/modinst -name '*.ko' | wc -l
          echo "=== camera.ko 是否构建 ==="
          find $GITHUB_WORKSPACE/modinst -name 'camera.ko' -o -name '*camera*.ko' | head -3

      - name: 打包上传
        run: |
          cd kernel
          mkdir -p $GITHUB_WORKSPACE/package
          cp out/arch/arm64/boot/Image $GITHUB_WORKSPACE/package/
          cp out/arch/arm64/boot/dts/vendor/qcom/*.dtbo $GITHUB_WORKSPACE/package/ 2>/dev/null || true
          mkdir -p $GITHUB_WORKSPACE/package/modules
          find $GITHUB_WORKSPACE/modinst -name '*.ko' -exec cp {} $GITHUB_WORKSPACE/package/modules/ \;
          cd $GITHUB_WORKSPACE/package
          ls -la
          zip -r9 $GITHUB_WORKSPACE/chn-package.zip . -x '*.git*'

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: chn-kernel-package
          path: chn-package.zip
