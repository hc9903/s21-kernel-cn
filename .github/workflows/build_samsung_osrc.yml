name: Samsung OSRC audit build

on:
  workflow_dispatch:
    inputs:
      firmware:
        description: Registered Samsung OSRC firmware
        required: true
        type: choice
        options:
          - G9910ZCUBHYDA
        default: G9910ZCUBHYDA
      mode:
        description: Build variant
        required: true
        type: choice
        options:
          - baseline
          - abi-pair
        default: baseline

permissions:
  contents: read

concurrency:
  group: samsung-osrc-${{ github.ref }}-${{ inputs.firmware }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.mode == 'abi-pair' && '["baseline","droidspaces"]' || format('["{0}"]', inputs.mode)) }}

    steps:
      - name: Checkout audit scripts
        uses: actions/checkout@v4

      - name: Resolve registered source
        id: source
        run: |
          python3 scripts/resolve_osrc.py \
            --manifest sources/sm-g9910-osrc.json \
            --firmware "${{ inputs.firmware }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git libelf-dev libssl-dev \
            python3 rsync xz-utils zip
          sudo apt-get install -y libncurses5 libtinfo5 2>/dev/null || true
          [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] || \
            sudo ln -sf libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          [ -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] || \
            sudo ln -sf libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Download and verify Samsung source
        env:
          SOURCE_URL: ${{ steps.source.outputs.source_url }}
          SOURCE_SHA256: ${{ steps.source.outputs.source_sha256 }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output samsung-osrc.zip "$SOURCE_URL"
          echo "$SOURCE_SHA256  samsung-osrc.zip" | sha256sum --check --strict
          mkdir source-archive kernel
          python3 -m zipfile -e samsung-osrc.zip source-archive
          tar --extract --gzip --no-same-owner \
            --file source-archive/Kernel.tar.gz --directory kernel
          chmod -R u+rwX kernel

      - name: Download Samsung toolchain
        run: |
          mkdir -p toolchains/clang
          curl --fail --location --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            | tar --extract --gzip --no-same-owner --directory toolchains/clang
          git clone --quiet --depth 1 --branch android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64
          toolchains/clang/bin/clang --version
          toolchains/clang/bin/ld.lld --version

      - name: Build and verify ${{ matrix.variant }}
        env:
          VARIANT: ${{ matrix.variant }}
          FIRMWARE: ${{ inputs.firmware }}
          DEFCONFIG: ${{ steps.source.outputs.defconfig }}
          LOCALVERSION: ${{ steps.source.outputs.localversion }}
        run: |
          scripts/build_samsung_osrc.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.firmware }}-${{ matrix.variant }}-build-log-${{ github.run_id }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.firmware }}-${{ matrix.variant }}-${{ github.run_id }}
          path: artifacts/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30

  compare-abi:
    name: Compare exported symbol CRCs
    if: ${{ inputs.mode == 'abi-pair' }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout comparison script
        uses: actions/checkout@v4

      - name: Download baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.firmware }}-baseline-${{ github.run_id }}
          path: compare/baseline

      - name: Download DroidSpaces artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.firmware }}-droidspaces-${{ github.run_id }}
          path: compare/droidspaces

      - name: Compare Module.symvers
        run: |
          mkdir -p abi-report
          python3 scripts/compare_symvers.py \
            compare/baseline/Module.symvers \
            compare/droidspaces/Module.symvers \
            --report abi-report/summary.txt

      - name: Upload ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.firmware }}-abi-report-${{ github.run_id }}
          path: abi-report/
          if-no-files-found: error
          retention-days: 30
