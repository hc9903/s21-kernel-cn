name: "S21 港版韩版路线 Droidspaces (保留 stock 模块, 只刷 boot)"

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: '版本串 (匹配港版 TGY, 让 stock /vendor 模块 vermagic 匹配)'
        required: false
        default: '-qgki-30957850-abG9910ZHSGHZB1'
      upload_release:
        description: '构建成功后上传 GitHub Release (true/false)'
        required: false
        default: 'true'
      ufw_fail2ban:
        description: '额外开启 UFW/Fail2ban 支持 (ipset/recent 匹配)。默认 false=严格复刻 F926N; true=超越(安全, 不改变量符号CRC)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: hktw-kr-ds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: 检出仓库 (脚本)
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libelf-dev libssl-dev python3 rsync unzip xz-utils zip cpio
          sudo apt-get install -y libncurses5 libtinfo5 2>/dev/null || true
          [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] || sudo ln -sf libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          [ -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] || sudo ln -sf libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: 下载工具链 (clang r383902b1 + binutils)
        run: |
          mkdir -p toolchains/clang toolchains/bin
          curl --fail --location --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            | tar --extract --gzip --no-same-owner --directory toolchains/clang
          # aarch64-linux-gnu binutils (LLD 链接需要 ld.lld 在 clang 里, binutils 提供 as/objcopy)
          sudo apt-get install -y binutils-aarch64-linux-gnu 2>/dev/null || true
          toolchains/clang/bin/clang --version | head -1

      - name: 下载并校验港版 HKTW 源码
        run: |
          for attempt in 1 2 3; do
            if curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
              --output samsung-osrc.zip \
              "https://github.com/hc9903/s21-kernel-cn/releases/download/1.0/SM-G9910_HKTW_15_Opensource.zip" 2>/tmp/curl_err.log; then break; fi
            echo "第 $attempt 次失败"; sleep 20
          done
          echo "f865dfab7099713a10bf54ae997d16959414ea8b834f816fdc2c32a2d477a852  samsung-osrc.zip" | sha256sum --check --strict
          mkdir source-archive kernel
          python3 -m zipfile -e samsung-osrc.zip source-archive
          tar --extract --gzip --no-same-owner --file source-archive/Kernel.tar.gz --directory kernel
          chmod -R u+rwX kernel

      - name: 应用韩版 Droidspaces 补丁 (module.c CRC + kABI + KDP)
        run: |
          cd kernel
          python3 "$GITHUB_WORKSPACE/scripts/patch_droidspaces_kr.py" "$GITHUB_WORKSPACE/kernel"
          echo "验证:"
          grep -c 'but ignoring' kernel/module.c
          grep -c "KABI_USE(6" kernel/../kernel/include/linux/sched.h 2>/dev/null || grep -c "KABI_USE(6" include/linux/sched.h

      - name: 追加 Droidspaces 配置 (韩版集, 保留 stock 模块 CRC)
        run: |
          cd kernel
          {
            echo ""
            echo "# Droidspaces support (韩版 Fold3 方案, 保留 stock 模块 CRC)"
            echo "CONFIG_SYSVIPC=y"
            echo "CONFIG_POSIX_MQUEUE=y"
            echo "CONFIG_IPC_NS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_UTS_NS=y"
            echo "CONFIG_USER_NS=y"
            echo "CONFIG_NAMESPACES=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "CONFIG_NF_CT_NETLINK=y"
            echo ""
            # UFW / Fail2ban 可选增强 (GKI 文档推荐; 仅新增匹配器不改符号CRC, 对 stock 模块安全)
            # 默认 false (strict F926N); ufw_fail2ban=true 时开启
            if [ "${{ inputs.ufw_fail2ban }}" = "true" ]; then
              echo "# UFW/Fail2ban support (Droidspaces GKI 可选推荐)"
              echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
              echo "CONFIG_IP_SET=y"
              echo "CONFIG_IP_SET_HASH_IP=y"
              echo "CONFIG_IP_SET_HASH_NET=y"
              echo "CONFIG_NETFILTER_XT_SET=y"
            fi
            echo ""
            echo "# 对齐港版版本串 (stock /vendor 模块 vermagic 匹配)"
            echo 'CONFIG_LOCALVERSION="${{ inputs.localversion }}"'
          } >> arch/arm64/configs/vendor/o1q_chn_hkx_defconfig
          echo "=== Droidspaces 配置已追加 ==="
          tail -20 arch/arm64/configs/vendor/o1q_chn_hkx_defconfig

      - name: 编译内核 (KDP 只关, 保留 stock 模块; 只产 Image, 不重编模块)
        run: |
          cd kernel
          export ARCH=arm64
          CLANG_BIN=$(dirname "$(find "$GITHUB_WORKSPACE/toolchains" -maxdepth 4 -type f -path '*/bin/clang' | head -n1)")
          echo "CLANG_BIN=$CLANG_BIN"
          # CLANG_BIN 已是 bin 目录; 直接把它加进 PATH 让 ld.lld 可寻 (勿再拼 /bin!)
          export PATH="$CLANG_BIN:$PATH"
          test -x "$CLANG_BIN/clang" || { echo "clang 未找到!"; exit 1; }
          command -v ld.lld || ls "$CLANG_BIN" | grep -E "^ld\.lld"
          MP="-j$(nproc) O=out DTC_EXT=$PWD/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"
          COMMON="LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CONFIG_SECTION_MISMATCH_WARN_ONLY=y DISABLE_WRAPPER=1 KCFLAGS=-Wno-strict-prototypes"
          make $MP $COMMON vendor/o1q_chn_hkx_defconfig
          make $MP $COMMON > "$GITHUB_WORKSPACE/build.log" 2>&1 || {
            echo "=== 构建失败 (关键错误) ==="
            grep -aE "error:|Error [0-9]+|fatal error|undefined reference|No rule|cannot|FAILED|中止|错误" "$GITHUB_WORKSPACE/build.log" | head -40
            echo "=== build.log 最后 30 行 ==="
            tail -30 "$GITHUB_WORKSPACE/build.log"
            exit 1; }
          ls -la out/arch/arm64/boot/Image

      - name: 严格验证 (版本串 + Droidspaces + CRC 补丁 + KDP)
        run: |
          cd kernel
          KREL=$(make O=out ARCH=arm64 -s kernelrelease)
          echo "kernelrelease=$KREL"
          # 严格锁定版本串: 完全相等 (不只要包含 localversion)
          EXPECT="5.4.274${{ inputs.localversion }}"
          test "$KREL" = "$EXPECT" || { echo "版本串不完全相等! got=$KREL expect=$EXPECT"; exit 1; }
          scripts/extract-ikconfig out/arch/arm64/boot/Image > /tmp/ikconfig.txt 2>/dev/null || { echo "extract-ikconfig 失败"; exit 1; }
          for sym in CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS CONFIG_USER_NS CONFIG_DEVTMPFS; do
            grep -q "$sym=y" /tmp/ikconfig.txt || { echo "$sym=y 缺失!"; exit 1; }
          done
          echo "Droidspaces 核心配置全部生效"
          grep -E "CONFIG_FASTUH=|CONFIG_FASTUH_RKP=|CONFIG_FASTUH_KDP=" /tmp/ikconfig.txt | tail -5
          # 对齐 F926N 的 4 项验证
          for c in "CONFIG_FASTUH_KDP is not set" "CONFIG_CRYPTO_FIPS is not set" "CONFIG_LOCALVERSION_AUTO is not set" "CONFIG_MODULE_FORCE_LOAD is not set"; do
            grep -q "^# $c" /tmp/ikconfig.txt || { echo "对齐F926N检查失败: $c"; exit 1; }
          done
          echo "对齐 F926N: KDP/CRYPTO_FIPS/LOCALVERSION_AUTO/MODULE_FORCE_LOAD 全部 not set OK"
          # ufw_fail2ban=true 时验证 ipset/recent 已开
          if [ "${{ inputs.ufw_fail2ban }}" = "true" ]; then
            for c in "CONFIG_IP_SET=y" "CONFIG_IP_SET_HASH_IP=y" "CONFIG_IP_SET_HASH_NET=y" "CONFIG_NETFILTER_XT_SET=y" "CONFIG_NETFILTER_XT_MATCH_RECENT=y"; do
              grep -q "^$c" /tmp/ikconfig.txt || { echo "UFW/Fail2ban 配置缺失: $c"; exit 1; }
            done
            echo "UFW/Fail2ban 增强配置全部生效 OK"
          else
            echo "ufw_fail2ban=false: 跳过 ipset/recent (strict F926N)"
          fi
          grep -q "^CONFIG_FASTUH=y" /tmp/ikconfig.txt && grep -q "^CONFIG_FASTUH_RKP=y" /tmp/ikconfig.txt && echo "FASTUH+RKP 保留 OK"
          echo "=== kernel 里 CRC 补丁痕迹 ==="
          grep -c "cannot match production symbol CRCs" out/arch/arm64/boot/Image || true
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/artifacts/Image"
          cp /tmp/ikconfig.txt "$GITHUB_WORKSPACE/artifacts/Image.config"
          echo "$KREL" > "$GITHUB_WORKSPACE/artifacts/kernelrelease.txt"

      - name: 下载港版 TGY 原厂 boot 模板 + magiskboot
        run: |
          mkdir -p "$GITHUB_WORKSPACE/inputs"
          cd "$GITHUB_WORKSPACE/inputs"
          curl --fail --location --retry 5 --retry-all-errors --output boot_TGY.lz4 \
            "https://github.com/hc9903/s21-kernel-cn/releases/download/1.0/boot.img_TGY_G9910ZHSGHZB1.lz4"
          curl --fail --location --retry 5 --retry-all-errors --output Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk"
          echo "e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5  Magisk.apk" | sha256sum --check --strict
          python3 -m zipfile -e Magisk.apk magisk-apk
          cp magisk-apk/lib/x86_64/libmagiskboot.so magiskboot
          chmod 0755 magiskboot
          ./magiskboot decompress boot_TGY.lz4 boot_stock.img
          echo "7b728e11a5b0ae2b0387784adc080c0a2f623e15d5f0b5b7cab5c7c2e536a00d  boot_stock.img" | sha256sum --check --strict
          test -x magiskboot && echo "magiskboot ready"

      - name: 打包 boot.img (保留原厂 ramdisk) + Odin tar
        env:
          KERNEL_IMAGE: ${{ github.workspace }}/artifacts/Image
          STOCK_BOOT: ${{ github.workspace }}/inputs/boot_stock.img
          MAGISKBOOT: ${{ github.workspace }}/inputs/magiskboot
          OUTPUT_DIR: ${{ github.workspace }}/flash-artifacts
          TARGET_KERNELRELEASE: 5.4.274${{ inputs.localversion }}
          EXPECTED_STOCK_BOOT_SHA256: 7b728e11a5b0ae2b0387784adc080c0a2f623e15d5f0b5b7cab5c7c2e536a00d
          SOURCE_DESC: "Samsung G9910ZHSGHZB1 HKTW OSRC + 韩版 Droidspaces 补丁"
          ROUTE_DESC: "保留 stock 模块 + CRC 补丁 + kABI padding + KDP 只关 (不改 /vendor)"
          BOOT_TEMPLATE_DESC: "港版 TGY 原厂 boot_stock.img"
        run: bash scripts/repack_ksu_boot.sh

      - name: 上传 GitHub Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cd flash-artifacts
          # 把验证产出的 evidence 从 artifacts/ 复制进 flash-artifacts/evidence/ (路径衔接)
          mkdir -p evidence
          if [ -f "$GITHUB_WORKSPACE/artifacts/Image.config" ]; then cp "$GITHUB_WORKSPACE/artifacts/Image.config" evidence/; fi
          if [ -f "$GITHUB_WORKSPACE/artifacts/kernelrelease.txt" ]; then cp "$GITHUB_WORKSPACE/artifacts/kernelrelease.txt" evidence/; fi
          RELEASE_TAG="hktw-kr-droidspaces-$RUN_ID"
          # 生成 compiler.txt (工具链信息, 供核对)
          {
            echo "clang:; $CLANG_BIN/clang --version 2>/dev/null | head -1"
            echo "toolchain: clang-r383902b1 (r383902b1, android-11.0.0_r48) + binutils-aarch64-linux-gnu"
          } > evidence/compiler.txt || true
          gh release create "$RELEASE_TAG" boot.img boot.tar NOTICE.txt SHA256SUMS \
            evidence/Image.config evidence/kernelrelease.txt evidence/compiler.txt \
            --repo "${{ github.repository }}" \
            --title "S21 港版韩版路线 Droidspaces 内核 run $RUN_ID" \
            --notes "韩版 Fold3 方案移植 (保留 stock 模块+CRC补丁+kABI+KDP只关)。版本串: 5.4.274${{ inputs.localversion }}。Odin AP 刷 boot.tar 或 magiskboot 刷 boot.img。不重编模块不改 /vendor."
          echo "=== Release 已创建: $RELEASE_TAG ==="