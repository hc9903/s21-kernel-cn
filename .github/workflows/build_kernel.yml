name: Build Kernel (LucasBlackLu base + Droidspaces)

on:
  workflow_dispatch:
    inputs:
      fragment_file:
        description: 'Droidspaces 配置片段 (none=不加)'
        required: false
        default: 'droidspaces.config'
      ksu:
        description: '集成 KernelSU (v0.9.5, 与上游一致)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts (本仓库)
        uses: actions/checkout@v4

      - name: 克隆上游内核源码 (LucasBlackLu, 含 techpack 相机驱动)
        run: |
          git clone -q --depth 1 --branch lineage-22.2 \
            https://github.com/LucasBlackLu/android_kernel_samsung_sm8350.git kernel
          cd kernel
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: 下载 AOSP clang-r530567 (与上游一致)
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz -O aosp-clang.tar.gz
          mkdir clang && tar -xf aosp-clang.tar.gz -C clang
          ls clang/bin/clang && clang/bin/clang --version | head -1

      - name: 注入 Droidspaces 配置片段
        run: |
          cd kernel
          DEF="arch/arm64/configs/o1q_defconfig"
          # 清理上游 defconfig 里的 git 冲突残留 (防止垃圾行混入配置)
          sed -i '/^<<<<<<< /d; /^=======$/d; /^>>>>>>> /d' "$DEF"
          FRAG="${{ github.event.inputs.fragment_file }}"
          if [ -n "$FRAG" ] && [ "$FRAG" != "none" ]; then
            echo "" >> "$DEF"
            cat "$GITHUB_WORKSPACE/$FRAG" >> "$DEF"
            echo "已追加配置片段: $FRAG"
          else
            echo "纯官方配置 (无片段)"
          fi

      - name: 集成 KernelSU (v0.9.5)
        if: ${{ github.event.inputs.ksu == 'true' }}
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          echo "KernelSU v0.9.5 已集成"

      - name: 构建内核 + 模块
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          TC="$GITHUB_WORKSPACE/clang"
          MP="-j$(nproc) -C $(pwd) O=$(pwd)/out ARCH=arm64 CC=clang CLANG_TRIPLE=$TC/bin/aarch64-linux-gnu- LLVM=1 CROSS_COMPILE=$TC/bin/llvm-"
          make $MP o1q_defconfig
          make $MP > $GITHUB_WORKSPACE/build.log 2>&1 || { echo "=== 构建失败, 日志末尾: ==="; tail -120 $GITHUB_WORKSPACE/build.log; exit 1; }
          make $MP INSTALL_MOD_PATH=modules INSTALL_MOD_STRIP=1 modules_install

      - name: 编译后验证
        run: |
          cd kernel
          echo "=== kernelrelease ==="
          make -s -C $(pwd) O=$(pwd)/out ARCH=arm64 kernelrelease
          echo "=== 关键配置 ==="
          grep -E "CONFIG_SYSVIPC|CONFIG_USER_NS|CONFIG_PID_NS|CONFIG_IPC_NS|CONFIG_POSIX_MQUEUE|CONFIG_DEVTMPFS|CONFIG_FAIR_GROUP_SCHED|CONFIG_NF_TABLES|CONFIG_KSU" out/.config | grep -v "^#"
          echo "=== 模块统计 ==="
          find out/modules -name '*.ko' | wc -l
          ls -la out/arch/arm64/boot/Image out/arch/arm64/boot/dtbo.img

      - name: 打包 AnyKernel3 zip
        run: |
          cd kernel
          git clone -q https://github.com/LucasBlackLu/AnyKernel3 -b samsung ./Anykernel3
          AK3=./Anykernel3
          if [ -d "$AK3/modules" ]; then rm -rf "$AK3/modules"; fi
          mkdir -p "$AK3/modules/vendor/lib/modules"
          find "$(pwd)/out/modules" -type f -iname '*.ko' -exec cp {} "$AK3/modules/vendor/lib/modules/" \;
          cp ./out/arch/arm64/boot/Image "$AK3/"
          cp ./out/arch/arm64/boot/dtbo.img "$AK3/"
          cd "$AK3"
          rm -rf Lavender* Droidspaces*
          ZIP="Droidspaces_$( [ '${{ github.event.inputs.ksu }}' = 'true' ] && echo KSU_ )o1q_SM-G9910"
          zip -r9 "$ZIP.zip" . -x '*.git*' '*patch*' '*ramdisk*' 'LICENSE' 'README.md'
          cd "$GITHUB_WORKSPACE"
          ls -la "$AK3/$ZIP.zip"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-package
          path: kernel/Anykernel3/Droidspaces*.zip
