name: "S21 o1q TWRP 构建 (twrp-12.1 / Android 15)"

on:
  workflow_dispatch:
    inputs:
      device_repo:
        description: '设备树仓库 (LucasBlackLu o1q Snapdragon)'
        required: false
        default: 'https://github.com/LucasBlackLu/twrp_device_samsung_o1q.git'
      device_branch:
        description: '设备树分支'
        required: false
        default: 'android-12.1'
      upload_release:
        description: '构建成功后上传 GitHub Release (true/false)'
        required: false
        default: 'true'
      adapt_a15:
        description: 'A15 适配 (fstab erofs/加密 + fallback 补丁; true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: twrp-o1q-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: Cleanup (腾磁盘)
        uses: rokibhasansagar/slimhub_actions@main

      - name: 安装构建依赖
        run: |
          sudo apt update && sudo apt -y upgrade
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar zip unzip

      - name: 安装 OpenJDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: 安装 repo 工具
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: 初始化 twrp-12.1 manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p workspace
          cd workspace
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

      - name: Repo Sync
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync

      - name: 克隆 o1q 设备树
        run: |
          cd workspace
          git clone "${{ inputs.device_repo }}" -b "${{ inputs.device_branch }}" ./device/samsung/o1q
          ls -la device/samsung/o1q/

      - name: A15 适配 (fstab erofs/加密 + fallback 补丁)
        if: ${{ github.event.inputs.adapt_a15 == 'true' }}
        run: |
          cd workspace
          python3 "$GITHUB_WORKSPACE/scripts/adapt_twrp_a15.py" \
            device/samsung/o1q \
            bootable/recovery \
            "$GITHUB_WORKSPACE"
          echo "=== 适配后 fstab (只读分区 + data) ==="
          grep -nE '^(system|vendor|product|odm)|userdata' device/samsung/o1q/recovery/root/system/etc/recovery.fstab
          echo "=== BoardConfig 尾部 ==="
          tail -7 device/samsung/o1q/BoardConfig.mk
          echo "=== 替换 multidisabler 为 A15 适配版 (处理 FBE v2 inlinecrypt/keydirectory) ==="
          cp "$GITHUB_WORKSPACE/scripts/multidisabler_a15.sh" device/samsung/o1q/recovery/root/system/bin/multidisabler
          chmod +x device/samsung/o1q/recovery/root/system/bin/multidisabler
          echo "multidisabler 已替换:"; head -5 device/samsung/o1q/recovery/root/system/bin/multidisabler

      - name: 设置 Swap (12GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: 构建 recoveryimage
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_o1q-eng
          make clean
          make recoveryimage -j$(nproc --all)
          ls -la out/target/product/o1q/

      - name: 打包 Odin tar
        run: |
          cd workspace/out/target/product/o1q
          cp recovery.img twrp-3.7.1_12-0-o1q.img
          tar -cf twrp-3.7.1_12-0-o1q.tar recovery.img
          ls -la twrp-3.7.1_12-0-o1q.img twrp-3.7.1_12-0-o1q.tar
          mkdir -p "$GITHUB_WORKSPACE/flash-artifacts"
          cp twrp-3.7.1_12-0-o1q.img "$GITHUB_WORKSPACE/flash-artifacts/"
          cp twrp-3.7.1_12-0-o1q.tar "$GITHUB_WORKSPACE/flash-artifacts/"

      - name: 写 NOTICE + SHA256SUMS
        run: |
          cd "$GITHUB_WORKSPACE/flash-artifacts"
          {
            echo "S21 (SM-G9910, o1q Snapdragon) TWRP 3.7.1 (twrp-12.1 / Android 15)"
            echo "manifest: minimal-manifest-twrp / twrp-12.1"
            echo "device-tree: LucasBlackLu/twrp_device_samsung_o1q (android-12.1)"
            echo "prebuilt-kernel: mohammad92/android_kernel_samsung_sm8350 (5.4.274)"
            echo "flash: Odin AP 刷 twrp-3.7.1_12-0-o1q.tar + USERDATA 刷 vbmeta_disabled"
            echo "recovery: 关机 -> 音量上 + 电源"
            echo "rescue: Odin 重刷原厂五件套"
          } > NOTICE.txt
          cat NOTICE.txt
          sha256sum twrp-3.7.1_12-0-o1q.img twrp-3.7.1_12-0-o1q.tar >SHA256SUMS
          cat SHA256SUMS

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-o1q-${{ github.run_id }}
          path: flash-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: 上传 GitHub Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flash-artifacts/twrp-3.7.1_12-0-o1q.img
            flash-artifacts/twrp-3.7.1_12-0-o1q.tar
            flash-artifacts/NOTICE.txt
            flash-artifacts/SHA256SUMS
          name: twrp-o1q-${{ github.run_id }}
          tag_name: twrp-o1q-${{ github.run_id }}
          body: "S21 o1q TWRP 3.7.1 (Android 15) — twrp-12.1 + LucasBlackLu o1q 设备树。Odin AP 刷 tar + USERDATA 刷 vbmeta_disabled。"
